<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VEDIC demonstration</title><style>:root{--bg:#000;--panel:#0b0e14;--line:#2f343d;--text:#fff;--muted:#a6adbb;--accent:#00ffff}*{box-sizing:border-box}body{background:var(--bg);color:var(--text);font:14px/1.6 'Courier New',monospace;margin:0}main{max-width:800px;margin:auto;padding:12px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:16px;margin:10px 0}h1,h2,a{color:var(--accent)}h1{font-size:24px}textarea,button{font:inherit;color:var(--text);background:#050505;border:1px solid var(--line);width:100%;padding:10px}textarea{min-height:140px}button{color:var(--accent);min-height:44px}pre{white-space:pre-wrap;overflow-wrap:anywhere}small{color:var(--muted)}a:focus-visible,button:focus-visible,textarea:focus-visible{outline:2px solid #fff;outline-offset:2px}</style></head><body><main><a href="./index.html#dictionary">← VEDIC dictionary</a><section class="panel"><h1 id="word">Demonstration</h1><p id="identity"></p><p id="purpose"></p><small>Runs the pinned, unmodified Ventus Grid Engine geodesy module locally. Example inputs are illustrative, not project data or proof of live GridAtlas operation.</small><p id="limit"></p><label for="args">Example inputs (editable JSON)</label><textarea id="args" spellcheck="false"></textarea><button id="run" disabled>RUN DEMONSTRATION</button><h2>Result</h2><pre id="result" role="status">Loading…</pre><a id="source" href="https://github.com/Ventusltd/ventus-grid-engine/blob/487ec7bd38dfa5aecb1c75da53b4a866ab2101cb/engine/v9-geodesy.js">Pinned original source</a> · <a href="./demo-engine/LICENSE">Licence</a> · <a href="./demo-engine/NOTICE">Notice</a></section></main><script type="module">
const $=id=>document.getElementById(id);
const example={distance:[0,0,1,0],point:[{type:'Polygon',coordinates:[[[0,0],[2,0],[2,2],[0,0]]]}],voltage:[{voltage:'750;132000',kv:33}],destination:[0,0,100,90],bearing:[0,0,1,0],orient:[0,0,1,0]};
function assert(ok,msg){if(!ok)throw Error(msg)}
function numeric(a,n){assert(a.length===n&&a.every(x=>typeof x==='number'&&Number.isFinite(x)),'Expected '+n+' finite numbers');assert(Math.abs(a[0])<=180&&Math.abs(a[1])<=90,'Origin longitude/latitude out of range')}
try{const [d,t,m]=await Promise.all([fetch('./data/dictionary.json').then(r=>{assert(r.ok,'Dictionary unavailable');return r.json()}),fetch('./data/translation-geodesy.json').then(r=>{assert(r.ok,'Translation unavailable');return r.json()}),import('./demo-engine/geodesy.mjs')]);
const id=new URLSearchParams(location.search).get('id');const entry=d.entries.find(e=>e.gg_id===id);assert(entry,'Unknown dictionary ID');const tr=t.records.find(r=>r.id===entry.translation_ref);$('word').textContent=entry.word;$('identity').textContent=entry.gg_id;$('purpose').textContent=tr?.purpose||entry.purpose;$('limit').textContent=tr?.limits||entry.limits;$('args').value=JSON.stringify(example[entry.demo],null,2);
const runners={distance:a=>{numeric(a,4);assert(Math.abs(a[2])<=180&&Math.abs(a[3])<=90,'Target out of range');return m.distanceKm(...a)},point:a=>{assert(a.length===1,'Expected one geometry');return m.representativePoint(a[0])},voltage:a=>{assert(a.length===1,'Expected one properties object');return m.voltagesKv(a[0])},destination:a=>{numeric(a,4);assert(a[2]>=0,'Distance must be nonnegative');return m.destinationPoint(...a)},bearing:a=>{numeric(a,4);assert(Math.abs(a[2])<=180&&Math.abs(a[3])<=90,'Target out of range');return m.initialBearingDeg(...a)},orient:a=>{numeric(a,4);assert(Math.abs(a[2])<=180&&Math.abs(a[3])<=90,'Target out of range');return {distance_km:m.distanceKm(...a),initial_bearing_deg:m.initialBearingDeg(...a)}}};assert(Object.hasOwn(runners,entry.demo),'No runnable demo');
$('run').disabled=false;$('result').textContent='Ready';$('run').onclick=()=>{try{const a=JSON.parse($('args').value);assert(Array.isArray(a),'Expected a JSON array');const result=runners[entry.demo](a);assert(result!==undefined&&!(typeof result==='number'&&!Number.isFinite(result)),'Result not finite');$('result').textContent=JSON.stringify(result,null,2)}catch(e){$('result').textContent='Cannot run: '+e.message}};}catch(e){$('result').textContent='Demonstration unavailable: '+e.message}
</script></body></html>
