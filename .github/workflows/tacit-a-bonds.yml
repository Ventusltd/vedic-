name: TACIT A sixth-turn typed bonds
on:
  pull_request:
    paths:
      - 'tools/tacit_a_*'
      - '.github/workflows/tacit-a-bonds.yml'
permissions:
  contents: read
  actions: read
jobs:
  bonds:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Acquire exact peer evidence and existing ports
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/tacit_a_bonds.py acquire --root "$RUNNER_TEMP/bonds"
      - name: Reproduce typed dependency manifest offline
        run: |
          mkdir evidence
          for n in first second; do
            sudo unshare --net -- setpriv --reuid "$(id -u)" --regid "$(id -g)" --clear-groups "$(command -v python)" tools/tacit_a_bonds.py verify --root "$RUNNER_TEMP/bonds" --out "evidence/$n.json"
          done
          cmp evidence/first.json evidence/second.json
          mv evidence/first.json evidence/bonds.json
          rm evidence/second.json
      - uses: actions/upload-artifact@v4
        with:
          name: tacit-a-typed-bonds
          path: evidence/
          if-no-files-found: error
