name: Spider evidence
on:
  pull_request:
    paths:
      - tools/spider_evidence.py
      - .github/workflows/spider-evidence.yml
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Ventusltd/spiders
          ref: 9801c73e8fd290d621bcf980fcc3fd6851229bf0
          path: spider-input
          persist-credentials: false
      - name: Validate original producer blobs and historical graph projections
        run: |
          python3 tools/spider_evidence.py --spiders spider-input --repo gridatlas --out /tmp/gridatlas-spider.json
          python3 tools/spider_evidence.py --spiders spider-input --repo gridatlas --out /tmp/gridatlas-spider-repeat.json
          cmp /tmp/gridatlas-spider.json /tmp/gridatlas-spider-repeat.json
          python3 tools/spider_evidence.py --spiders spider-input --repo vedic- --out /tmp/vedic-spider.json
          python3 - <<'PY'
          import json
          grid, vedic = [json.load(open('/tmp/'+n+'-spider.json')) for n in ('gridatlas','vedic')]
          assert grid['genome']['focus_present']
          assert len(grid['printer']['references']) == 22
          assert grid['genome']['node_count'] == 1379
          assert grid['genome']['edge_count'] == 3249
          assert not vedic['genome']['focus_present']
          assert not vedic['printer']['focus_present']
          assert not grid['execution_edges'] and not vedic['execution_edges']
          print('Pinned graph, deterministic replay, and absent VEDIC node controls passed')
          PY
