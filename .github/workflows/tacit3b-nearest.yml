name: TACIT 3b nearest candidate
on:
  pull_request:
    paths:
      - 'packages/nearest-candidate/**'
      - '.github/workflows/tacit3b-nearest.yml'
permissions:
  contents: read
jobs:
  development:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python packages/nearest-candidate/probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: tacit3b-nearest-evidence
          path: receipts/tacit3b-nearest.json
          if-no-files-found: error
          retention-days: 30
