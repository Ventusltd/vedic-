name: VEDIC semantic contracts
on:
  pull_request:
    paths:
      - 'tools/semantic_contracts.py'
      - 'tools/test_semantic_contracts.py'
      - 'data/dictionary.json'
      - 'data/tacit7-gis-sld-candidates.json'
      - 'data/translation-geodesy.json'
      - '.github/workflows/semantic-contracts.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install esprima==4.0.1 beautifulsoup4==4.13.4
      - run: python -m unittest discover -s tools -p test_semantic_contracts.py -v
      - name: Compile exact current dictionary pins
        run: python tools/semantic_contracts.py --output semantic-contracts.json --candidate-receipt data/tacit7-gis-sld-candidates.json --query "measure distance between geographic points"
      - uses: actions/upload-artifact@v4
        with:
          name: semantic-contracts
          path: semantic-contracts.json
          if-no-files-found: error
          retention-days: 30
