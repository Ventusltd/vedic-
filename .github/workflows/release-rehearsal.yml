name: VEDIC release rehearsal
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vedic-release-rehearsal-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  PYTHONUTF8: '1'
jobs:
  windows-snapshot:
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -W error::ResourceWarning -m unittest discover -s tools -p test_modular_snapshot.py -v
  pages-rehearsal:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.56.0
      - run: python -m playwright install --with-deps chromium webkit
      - run: python tools/check_pages_candidate.py
