name: TACIT A1 VEDIC compound language
on:
  pull_request:
    paths:
      - 'tools/tacit_a1_semantics.py'
      - '.github/workflows/tacit-a1-language.yml'
permissions:
  contents: read
  actions: read
jobs:
  semantic:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Stage pinned original semantic resolver and evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/tacit_a1_semantics.py acquire --root "$RUNNER_TEMP/semantic"
      - name: Compile three fresh named-point cases and challenge grammar offline
        run: |
          mkdir evidence
          for n in first second; do
            sudo unshare --net -- setpriv --reuid "$(id -u)" --regid "$(id -g)" --clear-groups "$(command -v python)" tools/tacit_a1_semantics.py verify --root "$RUNNER_TEMP/semantic" --out "evidence/$n.json"
          done
          cmp evidence/first.json evidence/second.json
          mv evidence/first.json evidence/semantic.json
          rm evidence/second.json
          sha256sum evidence/semantic.json
      - uses: actions/upload-artifact@v4
        with:
          name: tacit-a1-semantic-proof
          path: evidence/
          if-no-files-found: error
