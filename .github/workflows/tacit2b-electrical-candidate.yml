name: TACIT 2b electrical development evidence
on:
  pull_request:
    paths:
      - 'packages/electrical/**'
      - 'tools/tacit2b_electrical_acquire.py'
      - '.github/workflows/tacit2b-electrical-candidate.yml'
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Acquire exact source
        run: |
          python3 tools/tacit2b_electrical_acquire.py "$RUNNER_TEMP/tacit2b-input"
          cp packages/electrical/{adapter,test}.mjs "$RUNNER_TEMP/tacit2b-input/"
      - name: Offline numerical and contract tests
        shell: bash
        run: |
          set -euo pipefail
          node --version
          sudo unshare --net -- env -i PATH="$PATH" HOME="$RUNNER_TEMP" node --test "$RUNNER_TEMP/tacit2b-input/test.mjs" | tee "$RUNNER_TEMP/tacit2b-tests.txt"
      - name: Evidence only (no source or archive)
        uses: actions/upload-artifact@v4
        with:
          name: tacit2b-electrical-evidence
          path: |
            ${{ runner.temp }}/tacit2b-input/acquisition.json
            ${{ runner.temp }}/tacit2b-tests.txt
          retention-days: 30
