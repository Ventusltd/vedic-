name: VEDIC Modular Star consumer
on:
  workflow_dispatch:
  schedule:
    - cron: '37 3 * * *'
  pull_request:
    paths:
      - 'tools/modular_snapshot.py'
      - 'tools/test_modular_snapshot.py'
      - 'tools/daily_intelligence.py'
      - 'tools/family_pulse.py'
      - 'tools/test_family_pulse.py'
      - 'tools/dictionary_shards.py'
      - 'data/daily-command-queue.json'
      - 'data/admitted-queue-archive.json'
      - 'tools/allocate_commands.py'
      - 'tools/test_daily_intelligence.py'
      - '.github/workflows/modular-consumer.yml'
permissions:
  contents: read
concurrency:
  group: vedic-modular-consumer-${{ github.ref }}
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install duckdb==1.4.2
      - run: python -m unittest discover -s tools -p 'test_family_pulse.py' -v
      - run: python -m unittest discover -s tools -p 'test_modular_snapshot.py' -v
      - run: python -m unittest discover -s tools -p 'test_daily_intelligence.py' -v
      - name: Daily bounded command discovery
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python tools/daily_intelligence.py
      - name: Compressed family pulse and reviewed command proposal (read-only PR rehearsal)
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cursor=0
          pass_number=1
          state_base=INITIAL
          state_ref=refs/heads/automation/vedic-research-state
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            if state_line=$(git ls-remote --exit-code origin "$state_ref"); then
              state_base=$(printf '%s\n' "$state_line" | cut -f1)
              git fetch --no-tags origin "$state_base"
              git show "$state_base:state/family-research.json" > "$RUNNER_TEMP/vedic-state.json"
              cursor=$(jq -er '.next_cursor | select(type == "number" and . >= 0 and floor == .)' "$RUNNER_TEMP/vedic-state.json")
              pass_number=$(jq -er '.pass_number | select(type == "number" and . >= 1 and floor == .)' "$RUNNER_TEMP/vedic-state.json")
            else
              status=$?
              if [ "$status" != 2 ]; then exit "$status"; fi
              echo "::warning::No durable research state branch exists; explicitly starting pass 1."
            fi
          fi
          python tools/family_pulse.py --cursor "$cursor" --pass-number "$pass_number"
          printf '%s\n' "$state_base" > receipts/state-base.txt
          cat receipts/family-research.json
      - name: Acquire and validate existing producer database (manual only)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/modular_snapshot.py --output receipts/modular-snapshot.json
      - uses: actions/upload-artifact@v4
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        with:
          name: vedic-research-${{ github.run_id }}-${{ github.run_attempt }}
          path: receipts/
          if-no-files-found: error
          retention-days: 14

  propose-reviewed-append:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: vedic-research-${{ github.run_id }}-${{ github.run_attempt }}
          path: receipts
      - name: Persist completed discovery independently of admissions
        run: |
          set -euo pipefail
          state_ref=refs/heads/automation/vedic-research-state
          expected=$(cat receipts/state-base.txt)
          if state_line=$(git ls-remote --exit-code origin "$state_ref"); then
            actual=$(printf '%s\n' "$state_line" | cut -f1)
            test "$actual" = "$expected"
            git fetch --no-tags origin "$actual"
            base="$actual"
          else
            status=$?
            test "$status" = 2
            test "$expected" = INITIAL
            base=$(git rev-parse HEAD)
          fi
          git worktree add --detach "$RUNNER_TEMP/vedic-state" "$base"
          mkdir -p "$RUNNER_TEMP/vedic-state/state"
          jq '{schema:"vedic.research-state.v1",next_cursor,pass_number,pass_complete,producer_asset,producer_family_count}' receipts/family-research.json > "$RUNNER_TEMP/vedic-state/state/family-research.json"
          git -C "$RUNNER_TEMP/vedic-state" config user.name 'github-actions[bot]'
          git -C "$RUNNER_TEMP/vedic-state" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$RUNNER_TEMP/vedic-state" add state/family-research.json
          if ! git -C "$RUNNER_TEMP/vedic-state" diff --cached --quiet; then
            git -C "$RUNNER_TEMP/vedic-state" commit -m "Record VEDIC research pass ${GITHUB_RUN_ID}"
            git -C "$RUNNER_TEMP/vedic-state" push origin "HEAD:$state_ref"
          fi
      - name: Submit reviewed append through normal CI/CD
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f receipts/admission/dictionary.json ]; then
            echo "No new reviewed commands; no commit or PR"
            exit 0
          fi
          existing=$(gh pr list --base main --state open --json headRefName --jq '[.[]|select(.headRefName|startswith("automation/vedic-daily-"))]|length')
          if [ "$existing" != 0 ]; then
            echo "A daily admission PR is already open; preserve the queue"
            exit 0
          fi
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "Main advanced; retry next cycle without allocating conflicting IDs"
            exit 1
          fi
          branch="automation/vedic-daily-${GITHUB_RUN_ID}"
          python tools/family_pulse.py --verify-proposal
          cp receipts/admission/dictionary.json data/dictionary.json
          cp receipts/admission/daily-command-queue.json data/daily-command-queue.json
          cp receipts/admission/admitted-queue-archive.json data/admitted-queue-archive.json
          git switch -c "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/dictionary.json data/daily-command-queue.json data/admitted-queue-archive.json
          python tools/allocate_commands.py --check
          git commit -m "Append reviewed VEDIC commands and archive admission records"
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title "VEDIC: daily reviewed command additions" --body "Append-only, duplicate-checked allocation. Review and merge under normal repository rules."
          gh workflow run anatomy.yml --ref "$branch"
          gh workflow run release-rehearsal.yml --ref "$branch"
