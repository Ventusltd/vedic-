name: VEDIC Modular Star consumer
on:
  workflow_dispatch:
  schedule:
    - cron: '37 3 * * *'
  pull_request:
    paths:
      - 'tools/modular_snapshot.py'
      - 'tools/test_modular_snapshot.py'
      - 'tools/daily_intelligence.py'
      - 'tools/family_pulse.py'
      - 'tools/test_family_pulse.py'
      - 'tools/dictionary_shards.py'
      - 'data/daily-command-queue.json'
      - 'tools/test_daily_intelligence.py'
      - '.github/workflows/modular-consumer.yml'
permissions:
  contents: read
concurrency:
  group: vedic-modular-consumer-${{ github.ref }}
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install duckdb==1.4.2
      - run: python -m unittest discover -s tools -p 'test_family_pulse.py' -v
      - run: python -m unittest discover -s tools -p 'test_modular_snapshot.py' -v
      - run: python -m unittest discover -s tools -p 'test_daily_intelligence.py' -v
      - name: Daily bounded command discovery
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python tools/daily_intelligence.py
      - name: Compressed family pulse and reviewed command proposal (read-only PR rehearsal)
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cursor=0
          previous=$(gh run list --workflow modular-consumer.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "$previous" ]; then
            mkdir -p "$RUNNER_TEMP/previous"
            gh run download "$previous" --pattern 'vedic-research-*' --dir "$RUNNER_TEMP/previous" || true
            receipt=$(find "$RUNNER_TEMP/previous" -name family-research.json -print -quit)
            if [ -n "$receipt" ]; then cursor=$(jq -er '.next_cursor' "$receipt"); fi
          fi
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then cursor=0; fi
          python tools/family_pulse.py --cursor "$cursor"
          cat receipts/family-research.json
      - name: Acquire and validate existing producer database (manual only)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/modular_snapshot.py --output receipts/modular-snapshot.json
      - uses: actions/upload-artifact@v4
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        with:
          name: vedic-research-${{ github.run_id }}-${{ github.run_attempt }}
          path: receipts/
          if-no-files-found: error
          retention-days: 14

  propose-reviewed-append:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: vedic-research-${{ github.run_id }}-${{ github.run_attempt }}
          path: receipts
      - name: Submit reviewed append through normal CI/CD
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f receipts/admission/dictionary.json ]; then
            echo "No new reviewed commands; no commit or PR"
            exit 0
          fi
          existing=$(gh pr list --base main --state open --json headRefName --jq '[.[]|select(.headRefName|startswith("automation/vedic-daily-"))]|length')
          if [ "$existing" != 0 ]; then
            echo "A daily admission PR is already open; preserve the queue"
            exit 0
          fi
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "Main advanced; retry next cycle without allocating conflicting IDs"
            exit 1
          fi
          branch="automation/vedic-daily-${GITHUB_RUN_ID}"
          cp receipts/admission/dictionary.json data/dictionary.json
          git switch -c "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/dictionary.json
          git commit -m "Append reviewed VEDIC commands"
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title "VEDIC: daily reviewed command additions" --body "Append-only, duplicate-checked allocation. Review and merge under normal repository rules."
          gh workflow run anatomy.yml --ref "$branch"
          gh workflow run release-rehearsal.yml --ref "$branch"
