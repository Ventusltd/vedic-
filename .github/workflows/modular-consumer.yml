name: VEDIC Modular Star consumer
on:
  workflow_dispatch:
    inputs:
      accelerator:
        description: Rehearse the nightly CPU accelerator on the current verified Modular Star snapshot
        type: boolean
        default: false
  schedule:
    - cron: '37 3 * * *'
  pull_request:
    paths:
      - 'tools/modular_snapshot.py'
      - 'tools/modular_features.py'
      - 'tools/estate_crib_search.py'
      - 'tools/estate_domain_scan.py'
      - 'tools/daily_accelerator.py'
      - 'tools/test_daily_accelerator.py'
      - 'data/estate-crib-library.json'
      - 'tools/test_modular_snapshot.py'
      - 'tools/daily_intelligence.py'
      - 'tools/daily_operations.py'
      - 'tools/test_daily_operations.py'
      - 'tools/daily_source_policy.py'
      - 'tools/test_daily_source_policy.py'
      - 'tools/source_admissions.py'
      - 'tools/test_source_admissions.py'
      - 'tools/family_pulse.py'
      - 'tools/test_family_pulse.py'
      - 'tools/dictionary_shards.py'
      - 'data/daily-command-queue.json'
      - 'data/source-command-candidates.json'
      - 'data/source-policy*.json'
      - 'data/admitted-queue-archive.json'
      - 'tools/test_daily_intelligence.py'
      - '.github/workflows/modular-consumer.yml'
permissions:
  contents: read
concurrency:
  group: vedic-modular-consumer-${{ github.ref }}
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install duckdb==1.4.2
      - name: Install CPU accelerator dependencies
        if: github.event_name == 'schedule' || inputs.accelerator || github.event_name == 'pull_request'
        run: python -m pip install numpy==2.4.6 pyarrow==25.0.1
      - name: Test CPU accelerator and checkpoint progression
        if: github.event_name == 'schedule' || inputs.accelerator || github.event_name == 'pull_request'
        run: python -m unittest discover -s tools -p 'test_daily_accelerator.py' -v
      - run: python -m unittest discover -s tools -p 'test_family_pulse.py' -v
      - run: python -m unittest discover -s tools -p 'test_modular_snapshot.py' -v
      - run: python -m unittest discover -s tools -p 'test_daily_intelligence.py' -v
      - name: Historical research preview
        if: github.event_name == 'workflow_dispatch'
        run: python tools/daily_intelligence.py --output "$RUNNER_TEMP/receipts/daily-research.json"
      - name: Compressed family pulse and CPU accelerator
        id: research
        shell: bash
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          ACCELERATOR_PREVIEW: ${{ inputs.accelerator }}
          OPENBLAS_NUM_THREADS: '2'
          OMP_NUM_THREADS: '2'
        run: |
          run=()
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            run=(--run-id "$GITHUB_RUN_ID" --accelerator)
          elif [ "$ACCELERATOR_PREVIEW" = "true" ]; then
            run=(--accelerator)
          fi
          python tools/daily_operations.py research --output "$RUNNER_TEMP/receipts" "${run[@]}"
          if [ -f "$RUNNER_TEMP/receipts/accelerator-research.json" ]; then
            echo 'accelerator=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Acquire and validate existing producer database (manual only)
        if: github.event_name == 'workflow_dispatch' && !inputs.accelerator
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/modular_snapshot.py --output "$RUNNER_TEMP/receipts/modular-snapshot.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        with:
          name: vedic-research-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/receipts/
            !${{ runner.temp }}/receipts/accelerator-research.json
          if-no-files-found: error
          overwrite: true
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: steps.research.outputs.accelerator == 'true'
        with:
          name: vedic-accelerator-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/receipts/accelerator-research.json
          if-no-files-found: error
          retention-days: 14

  record-family-progress:
    if: github.event_name == 'schedule' && github.ref == 'refs/heads/main' && github.repository == 'Ventusltd/vedic-'
    needs: snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: vedic-research-${{ github.run_id }}
          path: ${{ runner.temp }}/receipts/
      - run: python tools/daily_operations.py persist --output "$RUNNER_TEMP/receipts" --run-id "$GITHUB_RUN_ID"

  proposal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      status: ${{ steps.prepare.outputs.status }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tools -p 'test_daily_operations.py' -v
      - name: Prepare bounded source admission for review
        id: prepare
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          started=$(gh run view "$GITHUB_RUN_ID" --json createdAt --jq .createdAt)
          unset GH_TOKEN
          python tools/daily_operations.py proposal --output "$RUNNER_TEMP/proposal" --created-at "$started"
          status=$(jq -r .status "$RUNNER_TEMP/proposal/proposal.json")
          echo "status=$status" >> "$GITHUB_OUTPUT"
          case "$status" in
            no_change)
              echo 'No pending source admissions; preserve receipt and stop the proposal step successfully.' >> "$GITHUB_STEP_SUMMARY"
              exit 0
              ;;
            ready_for_review)
              echo 'A verified Git bundle is available in the VEDIC proposal artifact.' >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "Unrecognised proposal status: $status" >&2
              exit 1
              ;;
          esac
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vedic-proposal-${{ github.run_id }}
          path: ${{ runner.temp }}/proposal/
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  offer-review-pr:
    if: >-
      github.event_name == 'schedule' && github.ref == 'refs/heads/main' && github.repository == 'Ventusltd/vedic-' &&
      needs.proposal.outputs.status == 'ready_for_review' && vars.VEDIC_REVIEW_APP_CLIENT_ID != ''
    needs: proposal
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: vedic-proposal-${{ github.run_id }}
          path: ${{ runner.temp }}/proposal/
      - id: review-app
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3
        with:
          client-id: ${{ vars.VEDIC_REVIEW_APP_CLIENT_ID }}
          private-key: ${{ secrets.VEDIC_REVIEW_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Offer independently gated review PR
        env:
          GH_TOKEN: ${{ steps.review-app.outputs.token }}
        run: |
          gh auth setup-git
          python tools/daily_operations.py review-pr --output "$RUNNER_TEMP/proposal"
