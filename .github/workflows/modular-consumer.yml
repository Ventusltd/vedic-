name: VEDIC daily family command pulse
on:
  workflow_dispatch:
  schedule:
    - cron: '37 3 * * *'
  pull_request:
    paths:
      - 'tools/daily_intelligence.py'
      - 'tools/test_daily_intelligence.py'
      - 'data/daily-command-queue.json'
      - '.github/workflows/modular-consumer.yml'
permissions:
  contents: read
concurrency:
  group: vedic-daily-family-${{ github.ref }}
  cancel-in-progress: false
jobs:
  pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install duckdb==1.4.2
      - run: python -m unittest discover -s tools -p 'test_daily_intelligence.py' -v
      - name: Discover family pulse and allocate reviewed commands
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cursor=0
          previous=$(gh run list --workflow modular-consumer.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "$previous" ]; then
            mkdir -p "$RUNNER_TEMP/previous"
            gh run download "$previous" --pattern 'vedic-pulse-*' --dir "$RUNNER_TEMP/previous" || true
            receipt=$(find "$RUNNER_TEMP/previous" -name daily-research.json -print -quit)
            if [ -n "$receipt" ]; then cursor=$(jq -er '.next_cursor' "$receipt"); fi
          fi
          python tools/daily_intelligence.py --cursor "$cursor"
          git diff -- data/dictionary.json
          if ! git diff --quiet -- data/dictionary.json; then
            mkdir -p receipts/admission
            cp data/dictionary.json receipts/admission/dictionary.json
          fi
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: vedic-pulse-${{ github.run_id }}
          path: receipts/
          retention-days: 14
          if-no-files-found: error
  propose:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: pulse
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: vedic-pulse-${{ github.run_id }}
          path: receipts
      - name: Submit reviewed append through normal CI/CD
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f receipts/admission/dictionary.json ]; then
            echo "No new reviewed commands; no commit or PR"
            exit 0
          fi
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "Main advanced; retry next cycle without allocating conflicting IDs"
            exit 1
          fi
          branch="automation/vedic-daily-${GITHUB_RUN_ID}"
          cp receipts/admission/dictionary.json data/dictionary.json
          git switch -c "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/dictionary.json
          git commit -m "Append reviewed VEDIC commands"
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title "VEDIC: daily reviewed command additions" --body "Append-only, duplicate-checked allocation. Review and merge through normal repository rules."
          gh workflow run anatomy.yml --ref "$branch"
