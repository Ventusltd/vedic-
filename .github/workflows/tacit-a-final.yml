name: TACIT A tenth-turn cold estate recovery
on:
  pull_request:
    paths:
      - 'tools/tacit_a_final.py'
      - '.github/workflows/tacit-a-final.yml'
permissions:
  contents: read
  actions: read
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Acquire original recovery inputs and exact A B C D evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/tacit_a_final.py acquire --root "$RUNNER_TEMP/final-a"
      - name: Replay original recovery and reconcile all channels twice offline
        run: |
          mkdir evidence
          for n in first second; do
            sudo unshare --net -- setpriv --reuid "$(id -u)" --regid "$(id -g)" --clear-groups "$(command -v python)" tools/tacit_a_final.py verify --root "$RUNNER_TEMP/final-a" --out "evidence/$n.json"
          done
          cmp evidence/first.json evidence/second.json
          mv evidence/first.json evidence/recovery.json
          rm evidence/second.json
      - uses: actions/upload-artifact@v4
        with:
          name: tacit-a-final-recovery
          path: evidence/
          if-no-files-found: error
