name: VEDIC anatomy checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vedic-anatomy-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  validate:
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.4.6 pyarrow==25.0.1 duckdb==1.4.2
      - run: python -m unittest discover -s tools -p 'test_*.py' -v
      - run: python tools/validate_anatomy.py --online
      - run: python tools/validate_translation.py --online
      - run: python tools/validate_graph.py --online
      - run: python tools/verify_reuse_routes.py
      - name: Check permanent dictionary identity against previous release
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_SHA" ] && git cat-file -e "$BASE_SHA:data/dictionary.json" 2>/dev/null; then
            git show "$BASE_SHA:data/dictionary.json" > "$RUNNER_TEMP/vedic-prior.json"
            python tools/validate_dictionary.py --online --prior "$RUNNER_TEMP/vedic-prior.json"
          else
            python tools/validate_dictionary.py --online
          fi
      - run: python tools/validate_v2_allocation.py --online
      - run: python tools/allocate_commands.py --check
      - run: python tools/source_admissions.py --check --online
      - run: python tools/stage_demo.py
      - run: python -m pip install playwright==1.56.0
      - run: python -m playwright install --with-deps chromium webkit
      - run: python tools/browser_smoke.py
      - run: python tools/stage_pages.py _site
      - run: python tools/check_pages_candidate.py _site
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: _site

  publish:
    timeout-minutes: 20
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: vedic-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - name: Stage public dashboard only
        run: python tools/stage_pages.py _site
      - name: Refuse stale or mismatched release immediately before deployment
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          remote="$(git ls-remote --exit-code origin refs/heads/main)"
          test "$(printf '%s\n' "$remote" | cut -f1)" = "$GITHUB_SHA"
          python -c 'import json, os; from pathlib import Path; r=json.loads(Path("_site/release.json").read_bytes()); assert r["source_commit"] == os.environ["GITHUB_SHA"], "staged release identity mismatch"'
      - name: Deploy validated dashboard
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
      - name: Verify exact served dashboard files
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: python tools/verify_published.py
      - name: Install browser runtime for live readback
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium webkit
      - name: Verify all direct source anchors on the exact published release
        run: python -c 'import os, sys; sys.path.insert(0, "tools"); from browser_smoke import audit_live; audit_live(expected_identity=os.environ["GITHUB_SHA"] )'
