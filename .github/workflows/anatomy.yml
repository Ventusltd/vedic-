name: VEDIC anatomy checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tools -p 'test_*.py' -v
      - run: python tools/validate_anatomy.py --online
      - run: python tools/validate_translation.py --online
      - run: python tools/validate_graph.py --online
      - run: python -m pip install playwright==1.56.0
      - run: python -m playwright install --with-deps chromium webkit
      - run: python tools/browser_smoke.py
