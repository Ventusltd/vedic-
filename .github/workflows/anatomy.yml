name: VEDIC anatomy checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tools -p 'test_*.py' -v
      - run: python tools/validate_anatomy.py --online
      - run: python tools/validate_translation.py --online
      - run: python tools/validate_graph.py --online
      - name: Check permanent dictionary identity against previous release
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_SHA" ] && git cat-file -e "$BASE_SHA:data/dictionary.json" 2>/dev/null; then
            git show "$BASE_SHA:data/dictionary.json" > "$RUNNER_TEMP/vedic-prior.json"
            python tools/validate_dictionary.py --online --prior "$RUNNER_TEMP/vedic-prior.json"
          else
            python tools/validate_dictionary.py --online
          fi
      - run: python tools/stage_demo.py
      - run: python -m pip install playwright==1.56.0
      - run: python -m playwright install --with-deps chromium webkit
      - run: python tools/browser_smoke.py

  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: vedic-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/configure-pages@v5
      - name: Stage public dashboard only
        run: |
          mkdir -p _site/data
          cp index.html _site/
          cp data/anatomy.json data/translation-geodesy.json data/nearest-spider.json data/dictionary.json _site/data/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy validated dashboard
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify exact served dashboard files
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: python tools/verify_published.py
